<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom With Zara - Dynamic Rotating Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b132b; color: #f8fafc; padding: 10px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1c2541; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #3a506b; font-size: 11px; flex-wrap: wrap; gap: 6px; }
        .brand-badge { background: #00b4d8; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .status-dot { color: #2ec4b6; font-weight: bold; }
        .time-display { color: #38bdf8; font-weight: bold; }
        
        .sub-header { text-align: center; margin-bottom: 12px; }
        .sub-header h1 { color: #00b4d8; font-size: 18px; margin-bottom: 3px; }
        .sub-header p { color: #8d99ae; font-size: 11px; }
        .timer-text { color: #2ec4b6; font-weight: bold; font-size: 11px; margin-top: 2px; }

        .search-container { margin-bottom: 12px; text-align: center; }
        .search-input { width: 100%; max-width: 400px; padding: 8px 12px; background-color: #1c2541; border: 1px solid #3a506b; border-radius: 6px; color: #fff; font-size: 12px; outline: none; }
        .search-input:focus { border-color: #00b4d8; }

        .nav-container { display: flex; overflow-x: auto; gap: 6px; margin-bottom: 15px; padding-bottom: 5px; }
        .nav-btn { background-color: #1c2541; color: #cbd5e1; border: 1px solid #3a506b; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-weight: 600; font-size: 11px; white-space: nowrap; }
        .nav-btn:hover, .nav-btn.active { background-color: #00b4d8; color: #fff; border-color: #00b4d8; }

        .container { max-width: 900px; margin: 0 auto; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card { background-color: #1c2541; border-radius: 6px; padding: 10px; border: 1px solid #3a506b; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .card-header h3 { color: #fff; font-size: 13px; font-weight: bold; }
        .tag { background-color: #0b132b; color: #2ec4b6; padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: bold; border: 1px solid #1d3557; }
        
        .card-body p { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #283845; padding-top: 6px; }
        .price { font-size: 11px; font-weight: bold; color: #ffd166; }
        
        .btn { background-color: #2ec4b6; color: #0b132b; padding: 3px 10px; border-radius: 3px; text-decoration: none; font-weight: bold; font-size: 10px; }
        .btn:hover { background-color: #20b2aa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <span class="brand-badge">Freedom With Zara</span>
            <span class="status-dot">● Live Auto-Rotating</span>
            <span class="time-display" id="pkTime">📍 PKT Loading...</span>
        </div>

        <div class="sub-header">
            <h1>MEXC Dynamic Rotating Scanner</h1>
            <p>New Coins Rotating Automatically Every 10s</p>
            <div class="timer-text" id="timer">Next rotation in: 10s</div>
        </div>

        <div class="search-container">
            <input type="text" id="coinSearch" class="search-input" placeholder="Search any MEXC coin (e.g., BTC, PEPE)..." onkeyup="filterBySearch()">
        </div>

        <div class="nav-container">
            <button class="nav-btn active" onclick="filterSelection('allMexc', event)">🌐 All Mexc</button>
            <button class="nav-btn" onclick="filterSelection('hidden-bullish', event)">Hidden Bullish (25-40 RSI)</button>
            <button class="nav-btn" onclick="filterSelection('v1-method', event)">V1 Scalping (55-56 RSI)</button>
            <button class="nav-btn" onclick="filterSelection('rsi-55-60', event)">RSI 55-60 Range</button>
            <button class="nav-btn" onclick="filterSelection('ema', event)">EMA Crossover</button>
            <button class="nav-btn" onclick="filterSelection('order-block', event)">1H Order Block</button>
            <button class="nav-btn" onclick="filterSelection('alpha-sniper', event)">⚡ Alpha Sniper</button>
        </div>

        <div class="grid" id="coins-grid"></div>
    </div>

    <script>
        function updatePakistanTime() {
            const options = { timeZone: 'Asia/Karachi', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const timeString = new Intl.DateTimeFormat('en-US', options).format(new Date());
            document.getElementById('pkTime').innerText = `📍 Pakistan 🇵🇰 ${timeString}`;
        }
        setInterval(updatePakistanTime, 1000);
        updatePakistanTime();

        const fullMasterPool = [
            "BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "KASUSDT", "ADAUSDT", "DOTUSDT", "LINKUSDT", "FETUSDT", "ARBUSDT", 
            "RENDERUSDT", "SUIUSDT", "JASMYUSDT", "DOGEUSDT", "AVAXUSDT", "NEARUSDT", "MATICUSDT", "OPUSDT", "ATOMUSDT", "UNIUSDT",
            "APTUSDT", "INJUSDT", "TIAUSDT", "SEIUSDT", "PEPEUSDT", "SHIBUSDT", "FLOKIUSDT", "BONKUSDT", "WIFUSDT", "ICPUSDT"
        ];

        const sniperCoinsList = ["SOLUSDT", "RENDERUSDT", "INJUSDT", "TIAUSDT", "SEIUSDT", "PEPEUSDT", "FETUSDT", "NEARUSDT", "SUIUSDT", "DOGEUSDT"];

        let currentCat = 'allMexc';

        function generateRotatingData() {
            let shuffled = [...fullMasterPool].sort(() => 0.5 - Math.random());
            let list = [];
            let index = 0;

            for(let i = 0; i < 3; i++) {
                list.push({ symbol: shuffled[index++], cat: "hidden-bullish", desc: `MEXC Spot | RSI Zone 25-40` });
            }
            for(let i = 0; i < 3; i++) {
                list.push({ symbol: shuffled[index++], cat: "v1-method", desc: `MEXC Spot | RSI Zone 55-56` });
            }
            for(let i = 0; i < 3; i++) {
                list.push({ symbol: shuffled[index++], cat: "rsi-55-60", desc: `MEXC Spot | RSI Range 55-60` });
            }
            for(let i = 0; i < 2; i++) {
                list.push({ symbol: shuffled[index++], cat: "ema", desc: `MEXC Spot | EMA 9/21 Crossover` });
            }
            for(let i = 0; i < 2; i++) {
                list.push({ symbol: shuffled[index++], cat: "order-block", desc: `MEXC Spot | 1H Order Block` });
            }
            sniperCoinsList.forEach(sym => {
                list.push({ symbol: sym, cat: "alpha-sniper", desc: `MEXC Spot | Alpha Sniper Target` });
            });

            return list;
        }

        let coinList = generateRotatingData();

        function renderCoins(coinsToRender) {
            const grid = document.getElementById('coins-grid');
            grid.innerHTML = '';
            
            coinsToRender.forEach(coin => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${coin.symbol}</h3>
                        <span class="tag">${coin.cat.toUpperCase().replace('-', ' ')}</span>
                    </div>
                    <div class="card-body">
                        <p>${coin.desc}</p>
                    </div>
                    <div class="card-footer">
                        <span class="price">MEXC Live</span>
                        <a href="https://www.tradingview.com/chart/?symbol=MEXC:${coin.symbol}" target="_blank" class="btn">Chart</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterSelection(cat, event) {
            currentCat = cat;
            let buttons = document.getElementsByClassName('nav-btn');
            for(let btn of buttons) btn.classList.remove('active');
            if(event) event.target.classList.add('active');
            
            document.getElementById('coinSearch').value = '';

            let filtered;
            if(cat === 'allMexc') {
                filtered = fullMasterPool.map(sym => ({ symbol: sym, cat: 'allMexc', desc: 'MEXC Spot | Master Pool' }));
            } else if(cat === 'alpha-sniper') {
                filtered = coinList.filter(c => c.cat === 'alpha-sniper');
            } else {
                filtered = coinList.filter(c => c.cat === cat);
            }
            renderCoins(filtered);
        }

        function filterBySearch() {
            let query = document.getElementById('coinSearch').value.toUpperCase().trim();
            if(query !== "") {
                let searchResult = [{
                    symbol: query.includes("USDT") ? query : query + "USDT",
                    cat: "searched",
                    desc: `MEXC Live Spot | Manual Search Match`
                }];
                renderCoins(searchResult);
            } else {
                filterSelection(currentCat);
            }
        }

        // Initial Load showing All Mexc Master Pool
        filterSelection('allMexc');

        let timeLeft = 10;
        const timerEl = document.getElementById('timer');
        setInterval(() => {
            timeLeft--;
            if(timeLeft < 0) {
                timeLeft = 10;
                if(!document.getElementById('coinSearch').value && currentCat !== 'allMexc' && currentCat !== 'alpha-sniper') {
                    coinList = generateRotatingData();
                    filterSelection(currentCat);
                }
            }
            timerEl.innerText = "Next rotation in: " + timeLeft + "s";
        }, 1000);
    </script>
</body>
</html>
