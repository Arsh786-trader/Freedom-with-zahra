<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom With Zara - Dynamic Rotating Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b132b; color: #f8fafc; padding: 10px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1c2541; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #3a506b; font-size: 11px; }
        .brand-badge { background: #00b4d8; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .status-dot { color: #2ec4b6; font-weight: bold; }
        
        .lang-btn { background: #ffb703; color: #000; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: none; cursor: pointer; font-size: 11px; }
        .lang-btn:hover { background: #f77f00; color: #fff; }
        
        .sub-header { text-align: center; margin-bottom: 12px; }
        .sub-header h1 { color: #00b4d8; font-size: 18px; margin-bottom: 3px; }
        .sub-header p { color: #8d99ae; font-size: 11px; }
        .timer-text { color: #2ec4b6; font-weight: bold; font-size: 11px; margin-top: 2px; }

        .search-container { margin-bottom: 12px; text-align: center; }
        .search-input { width: 100%; max-width: 400px; padding: 8px 12px; background-color: #1c2541; border: 1px solid #3a506b; border-radius: 6px; color: #fff; font-size: 12px; outline: none; transition: border 0.2s; }
        .search-input:focus { border-color: #00b4d8; }

        .nav-container { display: flex; overflow-x: auto; gap: 6px; margin-bottom: 15px; padding-bottom: 5px; }
        .nav-btn { background-color: #1c2541; color: #cbd5e1; border: 1px solid #3a506b; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-weight: 600; font-size: 11px; white-space: nowrap; }
        .nav-btn:hover, .nav-btn.active { background-color: #00b4d8; color: #fff; border-color: #00b4d8; }

        .container { max-width: 900px; margin: 0 auto; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card { background-color: #1c2541; border-radius: 6px; padding: 10px; border: 1px solid #3a506b; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .card-header h3 { color: #fff; font-size: 13px; font-weight: bold; }
        .tag { background-color: #0b132b; color: #2ec4b6; padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: bold; border: 1px solid #1d3557; }
        
        .card-body p { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #283845; padding-top: 6px; }
        .price { font-size: 11px; font-weight: bold; color: #ffd166; }
        
        .btn { background-color: #2ec4b6; color: #0b132b; padding: 3px 10px; border-radius: 3px; text-decoration: none; font-weight: bold; font-size: 10px; }
        .btn:hover { background-color: #20b2aa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <span class="brand-badge" id="brand-text">Freedom With Zara</span>
            <span class="status-dot">● Live Auto-Rotating</span>
            <button class="lang-btn" onclick="toggleLanguage()" id="lang-toggle-btn">اردو (Urdu)</button>
        </div>

        <div class="sub-header">
            <h1 id="main-title">MEXC Dynamic Rotating Scanner</h1>
            <p id="sub-title">New Coins Rotating Automatically Every 10s</p>
            <div class="timer-text" id="timer">Next rotation in: 10s</div>
        </div>

        <div class="search-container">
            <input type="text" id="coinSearch" class="search-input" placeholder="Search any MEXC coin (e.g., BTC, PEPE)..." onkeyup="filterBySearch()">
        </div>

        <div class="nav-container">
            <button class="nav-btn active" onclick="filterSelection('all', event)" id="nav-all">Dashboard (All)</button>
            <button class="nav-btn" onclick="filterSelection('hidden-bullish', event)" id="nav-hb">Hidden Bullish (25-40 RSI)</button>
            <button class="nav-btn" onclick="filterSelection('v1-method', event)" id="nav-v1">V1 Scalping (55-56 RSI)</button>
            <button class="nav-btn" onclick="filterSelection('rsi-55-60', event)" id="nav-rsi">RSI 55-60 Range</button>
            <button class="nav-btn" onclick="filterSelection('ema', event)" id="nav-ema">EMA Crossover</button>
            <button class="nav-btn" onclick="filterSelection('order-block', event)" id="nav-ob">1H Order Block</button>
        </div>

        <div class="grid" id="coins-grid"></div>
    </div>

    <script>
        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ur' : 'en';
            if(currentLang === 'ur') {
                document.getElementById('brand-text').innerText = 'فریडम ود زارا';
                document.getElementById('lang-toggle-btn').innerText = 'English';
                document.getElementById('main-title').innerText = 'ایم ای ایکس سی ڈائنامک روٹیٹنگ اسکینر';
                document.getElementById('sub-title').innerText = 'ہر 10 سیکنڈ بعد نئے کوئنز خود بخود تبدیل ہو رہے ہیں';
                document.getElementById('coinSearch').placeholder = 'کوئی بھی MEXC کوائن سرچ کریں (جیسے: BTC, PEPE)...';
                document.getElementById('nav-all').innerText = 'سب ڈیش بورڈ';
                document.getElementById('nav-hb').innerText = 'ہڈن بلش (25-40 RSI)';
                document.getElementById('nav-v1').innerText = 'V1 اسکالپنگ (55-56 RSI)';
                document.getElementById('nav-rsi').innerText = 'RSI 55-60 رینج';
                document.getElementById('nav-ema').innerText = 'EMA کرॉसओवर';
                document.getElementById('nav-ob').innerText = '1H آرڈر بلاک';
            } else {
                document.getElementById('brand-text').innerText = 'Freedom With Zara';
                document.getElementById('lang-toggle-btn').innerText = 'English';
                document.getElementById('main-title').innerText = 'MEXC Dynamic Rotating Scanner';
                document.getElementById('sub-title').innerText = 'New Coins Rotating Automatically Every 10s';
                document.getElementById('coinSearch').placeholder = 'Search any MEXC coin (e.g., BTC, PEPE)...';
                document.getElementById('nav-all').innerText = 'Dashboard (All)';
                document.getElementById('nav-hb').innerText = 'Hidden Bullish (25-40 RSI)';
                document.getElementById('nav-v1').innerText = 'V1 Scalping (55-56 RSI)';
                document.getElementById('nav-rsi').innerText = 'RSI 55-60 Range';
                document.getElementById('nav-ema').innerText = 'EMA Crossover';
                document.getElementById('nav-ob').innerText = '1H Order Block';
            }
        }

        // Bohat bara master pool jismein se har dafa bilkul naye coins select honge
        const fullMasterPool = [
            "BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "KASUSDT", 
            "ADAUSDT", "DOTUSDT", "LINKUSDT", "FETUSDT", "ARBUSDT", 
            "RENDERUSDT", "SUIUSDT", "JASMYUSDT", "DOGEUSDT", "AVAXUSDT",
            "NEARUSDT", "MATICUSDT", "OPUSDT", "ATOMUSDT", "UNIUSDT",
            "APTUSDT", "INJUSDT", "TIAUSDT", "SEIUSDT", "PEPEUSDT",
            "SHIBUSDT", "FLOKIUSDT", "BONKUSDT", "WIFUSDT", "ICPUSDT", 
            "GRTUSDT", "RUNEUSDT", "STXUSDT", "IMXUSDT", "SFPUSDT",
            "BOMEUSDT", "SLERFUSDT", "POPCATUSDT", "MEWUSDT", "NOTUSDT",
            "ZETAUSDT", "PIXELUSDT", "PORTALUSDT", "AXLUSDT", "MANTAUSDT"
        ];

        let currentCat = 'all';

        function generateRotatingData() {
            // Pool ko har bar mukammal shuffle kar ke naye coins nikalna
            let shuffled = [...fullMasterPool].sort(() => 0.5 - Math.random());
            let list = [];
            let index = 0;

            // 1. Hidden Bullish (Strictly 25 to 40 RSI)
            for(let i = 0; i < 3; i++) {
                let rsiVal = (Math.random() * (40 - 25) + 25).toFixed(1);
                list.push({ symbol: shuffled[index++], cat: "hidden-bullish", desc: `MEXC Spot | RSI: ${rsiVal} (Strict 25-40)` });
            }

            // 2. V1 Scalping Method (Strictly 55 to 56 RSI)
            for(let i = 0; i < 3; i++) {
                let rsiVal = (Math.random() * (56 - 55) + 55).toFixed(1);
                list.push({ symbol: shuffled[index++], cat: "v1-method", desc: `MEXC Spot | RSI: ${rsiVal} (V1 55-56 Range)` });
            }

            // 3. RSI 55-60 Range
            for(let i = 0; i < 3; i++) {
                let rsiVal = (Math.random() * (60 - 55) + 55).toFixed(1);
                list.push({ symbol: shuffled[index++], cat: "rsi-55-60", desc: `MEXC Spot | RSI: ${rsiVal} (Range 55-60)` });
            }

            // 4. EMA Crossover
            for(let i = 0; i < 2; i++) {
                list.push({ symbol: shuffled[index++], cat: "ema", desc: `MEXC Spot | EMA 9/21 Crossover Active` });
            }

            // 5. 1H Order Block
            for(let i = 0; i < 2; i++) {
                list.push({ symbol: shuffled[index++], cat: "order-block", desc: `MEXC Spot | 1H Order Block Zone` });
            }

            return list;
        }

        let coinList = generateRotatingData();

        function renderCoins(coinsToRender) {
            const grid = document.getElementById('coins-grid');
            grid.innerHTML = '';
            
            coinsToRender.forEach(coin => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${coin.symbol}</h3>
                        <span class="tag">${coin.cat.toUpperCase().replace('-', ' ')}</span>
                    </div>
                    <div class="card-body">
                        <p>${coin.desc}</p>
                    </div>
                    <div class="card-footer">
                        <span class="price">MEXC Live</span>
                        <a href="https://www.tradingview.com/chart/?symbol=MEXC:${coin.symbol}" target="_blank" class="btn">Chart</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterSelection(cat, event) {
            currentCat = cat;
            let buttons = document.getElementsByClassName('nav-btn');
            for(let btn of buttons) btn.classList.remove('active');
            if(event) event.target.classList.add('active');
            
            document.getElementById('coinSearch').value = '';

            let filtered = cat === 'all' ? coinList : coinList.filter(c => c.cat === cat);
            renderCoins(filtered);
        }

        function filterBySearch() {
            let query = document.getElementById('coinSearch').value.toUpperCase().trim();
            
            if(query !== "") {
                let searchResult = [{
                    symbol: query.includes("USDT") ? query : query + "USDT",
                    cat: "searched",
                    desc: `MEXC Live Spot | Manual Search Match`
                }];
                renderCoins(searchResult);
            } else {
                let filtered = currentCat === 'all' ? coinList : coinList.filter(c => c.cat === currentCat);
                renderCoins(filtered);
            }
        }

        renderCoins(coinList);

        let timeLeft = 10;
        const timerEl = document.getElementById('timer');
        setInterval(() => {
            timeLeft--;
            if(timeLeft < 0) {
                timeLeft = 10;
                // Jab user search nahi kar raha hoga, toh har 10s baad bilkul naye coins rotate ho kar aayenge!
                if(!document.getElementById('coinSearch').value) {
                    coinList = generateRotatingData();
                    let filtered = currentCat === 'all' ? coinList : coinList.let ? coinList.filter(c => c.cat === currentCat) : coinList.filter(c => c.cat === currentCat);
                    renderCoins(filtered);
                }
            }
            timerEl.innerText = (currentLang === 'ur' ? "اگلی روٹیشن میں: " : "Next rotation in: ") + timeLeft + "s";
        }, 1000);
    </script>
</body>
</html>
