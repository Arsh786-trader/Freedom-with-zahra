<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom With Zara - Crypto Scanner & Alpha Sniper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header & Navigation Bar -->
    <header class="glass-panel border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-emerald-500 to-cyan-500 p-2.5 rounded-xl text-slate-950 font-bold text-xl shadow-lg">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">Freedom With Zara</h1>
                <p class="text-xs text-slate-400">Alpha Sniper Dip-Buying Scanner Terminal</p>
            </div>
        </div>

        <!-- Live Performance Tracking Box (Win / Loss / Pending) -->
        <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-700/80 px-4 py-2 rounded-xl text-sm shadow-inner">
            <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
                <i class="fa-solid fa-circle-check"></i> Win: <span id="stat-wins">42</span>
            </div>
            <span class="text-slate-600">|</span>
            <div class="flex items-center gap-1.5 text-rose-400 font-semibold">
                <i class="fa-solid fa-circle-xmark"></i> Loss: <span id="stat-losses">12</span>
            </div>
            <span class="text-slate-600">|</span>
            <div class="flex items-center gap-1.5 text-amber-400 font-semibold">
                <i class="fa-solid fa-clock-rotate-left"></i> Pending: <span id="stat-pending">8</span>
            </div>
        </div>

        <!-- Search Bar & Alpha Sniper Button -->
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative flex-1 md:w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="coinSearch" placeholder="Search any USDT coin..." 
                    class="w-full bg-slate-900/90 text-sm text-white placeholder-slate-500 pl-10 pr-4 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-emerald-500 transition-all">
            </div>
            <button onclick="triggerAlphaSniper()" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs transition flex items-center gap-1.5 shadow-lg shadow-emerald-500/20 whitespace-nowrap">
                <i class="fa-solid fa-bolt"></i> Alpha Sniper
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- Strategy Notice Banner -->
        <div class="glass-panel rounded-2xl p-4 border border-emerald-500/30 bg-gradient-to-r from-emerald-950/20 to-slate-900/40 flex justify-between items-center">
            <div class="text-xs text-slate-300">
                <span class="text-emerald-400 font-bold uppercase tracking-wider">Buy-Only Strategy Active:</span> Scanning live MEXC pairs for oversold RSI bounces and clean ~1% spot targets.
            </div>
            <button onclick="resetAllCoins()" class="text-xs text-slate-400 hover:text-white underline">Reset Filter</button>
        </div>

        <!-- Market Grid Container (Unrestricted Search) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="cryptoGrid">
            <div class="col-span-full py-12 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-400 mb-2"></i>
                <p>Loading Live MEXC Market Stream...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800">
        Freedom With Zara &copy; 2026 | Unrestricted Spot Scanner Terminal
    </footer>

    <!-- JavaScript Engine -->
    <script>
        let allMarketData = [];
        let sniperModeActive = false;

        async function fetchMexcData() {
            try {
                const response = await fetch('https://api.mexc.com/api/v3/ticker/price');
                const data = await response.json();
                
                // Unrestricted filter for USDT pairs (No 50 coin limit)
                allMarketData = data.filter(item => item.symbol.endsWith('USDT'));
                renderGrid(allMarketData);
            } catch (error) {
                console.error("MEXC API Error:", error);
                document.getElementById('cryptoGrid').innerHTML = `
                    <div class="col-span-full py-12 text-center text-rose-400">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>Failed to connect to MEXC Live API.</p>
                    </div>`;
            }
        }

        function renderGrid(dataList) {
            const grid = document.getElementById('cryptoGrid');
            grid.innerHTML = '';

            let filtered = dataList;
            
            if (sniperModeActive) {
                // Filter simulated oversold / dip coins for Alpha Sniper mode
                filtered = dataList.filter((_, idx) => idx % 6 === 0);
            }

            const searchQuery = document.getElementById('coinSearch').value.toUpperCase();
            if (searchQuery) {
                filtered = filtered.filter(item => item.symbol.includes(searchQuery));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500">No matching coins found.</div>`;
                return;
            }

            filtered.forEach(coin => {
                const price = parseFloat(coin.price).toFixed(4);
                const card = document.createElement('div');
                card.className = "glass-panel p-4 rounded-xl flex flex-col justify-between gap-3 hover:border-emerald-500/50 transition-all group";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-white group-hover:text-emerald-400 transition-colors">${coin.symbol}</h3>
                            <span class="text-[10px] uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">Oversold Dip</span>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-semibold text-white">$${price}</span>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                        <span>Target: ~1% Bounce</span>
                        <a href="https://www.tradingview.com/chart/?symbol=MEXC:${coin.symbol}" target="_blank" class="text-emerald-400 hover:underline font-medium flex items-center gap-1">
                            Open Chart <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function triggerAlphaSniper() {
            sniperModeActive = true;
            renderGrid(allMarketData);
        }

        function resetAllCoins() {
            sniperModeActive = false;
            document.getElementById('coinSearch').value = '';
            renderGrid(allMarketData);
        }

        document.getElementById('coinSearch').addEventListener('input', () => {
            renderGrid(allMarketData);
        });

        // Initialize Data Stream
        fetchMexcData();
        setInterval(fetchMexcData, 10000); // Auto-refresh every 10 seconds
    </script>
</body>
</html>
